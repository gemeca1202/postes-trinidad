<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Postes Trinidad de las Huertas</title>
<meta name="description" content="Croquis del Comité Vecinal para reportar y dar seguimiento al alumbrado del Fraccionamiento Trinidad de las Huertas.">
<meta name="theme-color" content="#7a1f2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Postes TH">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: guinda institutional header + stat strip, full-bleed street map, floating actions, bottom sheets. Colors from the Comité Vecinal seal: guinda, oro, verde. */
:root{
  --bg:#faf6ef; --ground:#f1e9dc; --street:#ffffff; --curb:#dccbb0; --ink:#2a1d1f; --muted:#715f57;
  --panel:#ffffff; --line:#ece1d0; --accent:#7a1f2b; --accent-ink:#ffffff; --gold:#c8902a; --green:#4c7a2e;
  --head:#7a1f2b; --head-ink:#ffffff; --head-gold:#e8b65a;
  --rep:#b3261e; --falta:#c8902a; --rev:#6a4c9c; --poda:#7a5230; --done:#4c7a2e; --plate:#15191a; --plate-ink:#f3f3ee;
  --display:"Montserrat","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 6px 24px rgba(60,20,25,.18);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1a1314; --ground:#221a1a; --street:#4a3c37; --curb:#66524b; --ink:#f3ebe3; --muted:#bba99c;
  --panel:#2a2021; --line:#46373a; --accent:#d0646f; --accent-ink:#1a1314; --gold:#e0ad4f; --green:#7fb35a;
  --head:#5c1520; --head-ink:#fff6ef; --head-gold:#e8b65a;
  --rep:#f06a5e; --falta:#e0ad4f; --rev:#b096e0; --poda:#c99566; --done:#7fb35a; --plate:#050707; --plate-ink:#f3f3ee;
  --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1314; --ground:#221a1a; --street:#4a3c37; --curb:#66524b; --ink:#f3ebe3; --muted:#bba99c;
  --panel:#2a2021; --line:#46373a; --accent:#d0646f; --accent-ink:#1a1314; --gold:#e0ad4f; --green:#7fb35a;
  --head:#5c1520; --head-ink:#fff6ef; --head-gold:#e8b65a;
  --rep:#f06a5e; --falta:#e0ad4f; --rev:#b096e0; --poda:#c99566; --done:#7fb35a; --plate:#050707; --plate-ink:#f3f3ee;
  --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--head)}
body{height:100%;margin:0;font-size:14px;-webkit-text-size-adjust:100%}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;overflow:hidden;touch-action:none}
.app{position:relative;height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--head);color:var(--head-ink);border-bottom:3px solid var(--head-gold);z-index:5}
.seal{width:44px;height:44px;border-radius:50%;background:#fff;flex:none;display:grid;place-items:center;box-shadow:0 0 0 2px var(--head-gold);overflow:hidden}
.seal img{width:42px;height:42px;object-fit:contain;display:block}
.top .eyebrow{font:700 10.5px var(--display);letter-spacing:.14em;color:var(--head-gold);text-transform:uppercase}
.top h1{font-family:var(--display);font-weight:800;font-size:clamp(14px,4vw,17px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15;margin:1px 0 0;letter-spacing:0;text-wrap:nowrap}
.top .grow{flex:1;min-width:0}
.stats{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);z-index:5;font-variant-numeric:tabular-nums}
.stat{flex:none;display:inline-flex;align-items:center;gap:5px;font:600 12px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 8px}
.stat b{font:800 13.5px var(--display)}
.stat i{width:9px;height:9px;border-radius:50%;display:inline-block}
.stat.muted{color:var(--muted);border-style:dashed}
.chips{display:flex;gap:6px;align-items:center}
.iconbtn{width:38px;height:38px;border-radius:999px;border:1px solid rgba(255,255,255,.55);background:transparent;color:var(--head-ink);display:grid;place-items:center;cursor:pointer;padding:0}
.iconbtn svg{width:19px;height:19px}
.iconbtn[aria-expanded="true"]{background:var(--head-gold);border-color:var(--head-gold);color:var(--head)}
.search{display:grid;gap:8px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);z-index:5}
.srow{display:flex;gap:8px;align-items:center}
.srow input{flex:1;min-width:0;font:600 16px var(--body);border-radius:999px;padding:10px 14px;background:var(--bg)}
.scount{font:600 12.5px var(--body);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.crews{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}
.crews .lbl{font:700 11px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:2px;flex:none}
.crews .chip{flex:none}
.crews .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip{font:600 12px var(--body);border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 10px;cursor:pointer}
.top .chip{border-color:rgba(255,255,255,.55);color:var(--head-ink);font-size:13px;padding:7px 12px}
.chip:focus-visible,.btn:focus-visible,.fab:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#map{flex:1;position:relative;background:var(--ground);overflow:hidden}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.street-c{stroke:var(--curb);fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.street{stroke:var(--street);fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.slabel{font:italic 500 11px var(--body);fill:var(--muted);paint-order:stroke;stroke:var(--ground);stroke-width:3px;pointer-events:none}
.slabel.main{font:700 11px var(--display);letter-spacing:.06em;fill:var(--accent);text-transform:uppercase}
.pin{cursor:grab}
.pin circle.dot{stroke:var(--panel);stroke-width:2.5}
.pin text{font:700 12px var(--display);fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pin.sel circle.ring{stroke:var(--ink);stroke-width:2.5;fill:none}
.pin.done circle.dot{fill:var(--done)}
.pin.drag{cursor:grabbing}
.pin.prog circle.dot{stroke:var(--gold);stroke-width:3.5;stroke-dasharray:5 3}
.pin.ok text{font-size:10px}
.fab[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:-2px 0 14px}
.seg button{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 6px;font:700 13px var(--display);cursor:pointer}
.seg button[aria-pressed="true"]{border-color:transparent;color:#fff}
.seg button[data-e="pendiente"][aria-pressed="true"]{background:var(--rep)}
.seg button[data-e="proceso"][aria-pressed="true"]{background:var(--gold)}
.seg button[data-e="atendido"][aria-pressed="true"]{background:var(--done)}
.seglbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.35;margin-top:-6px}
.hint.ok{color:var(--done);font-weight:600}.hint.err{color:var(--rep);font-weight:600}
.locbox{background:color-mix(in srgb,var(--gold) 10%,var(--panel));border:1px dashed color-mix(in srgb,var(--gold) 55%,transparent);border-radius:12px;padding:10px;display:grid;gap:8px}
.ghost{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:4 3}
.newpin circle{fill:var(--accent);stroke:var(--head-gold);stroke-width:3}
.newpin text{font:800 11px var(--display);fill:#fff;text-anchor:middle;dominant-baseline:central}
@media (prefers-reduced-motion:no-preference){.newpin .halo{animation:halo 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes halo{from{opacity:.55;transform:scale(1)}to{opacity:0;transform:scale(2.1)}}}
.newpin .halo{fill:var(--accent);stroke:none;opacity:.35}
.linkbtn{border:0;background:none;color:var(--accent);font:600 13.5px var(--body);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:2px 0;justify-self:start}
.fabs{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;align-items:flex-end;z-index:4}
.fab{border:0;border-radius:999px;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font:600 14px var(--body);padding:12px 16px;cursor:pointer;display:flex;align-items:center;gap:8px}
.fab.primary{background:var(--accent);color:var(--accent-ink);font:700 15px var(--display);letter-spacing:.01em;padding:14px 18px;box-shadow:0 0 0 3px var(--head-gold),var(--shadow)}
.fab svg{width:18px;height:18px}
.north{position:absolute;top:12px;right:max(12px,env(safe-area-inset-right,0px));z-index:4;width:46px;height:58px;border-radius:12px;background:var(--panel);box-shadow:var(--shadow);display:grid;place-items:center;align-content:center;gap:0;pointer-events:none}
.north svg{width:22px;height:26px;display:block}
.north b{font:800 13px var(--display);color:var(--accent);line-height:1;margin-top:2px}
.legend{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:8px 10px;font-size:12px;display:grid;gap:4px;z-index:4}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.banner{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:calc(max(12px,env(safe-area-inset-right,0px)) + 56px);top:12px;z-index:6;background:var(--panel);color:var(--ink);border:2px solid var(--accent);border-radius:14px;padding:10px 12px;font:700 14px var(--body);box-shadow:var(--shadow);display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.banner .msg{flex:1 1 100%;line-height:1.3}
.banner button{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:7px 12px;font:600 13px var(--body);cursor:pointer}
.banner button#cancelPlace{margin-left:auto}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;font-size:14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast button{background:transparent;border:0;color:var(--accent);font:700 14px var(--body);cursor:pointer;filter:brightness(1.4)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:8;background:var(--panel);border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.22);max-height:82%;overflow:auto;padding-block:8px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet.compact{max-height:56%}
.grab{width:44px;height:4px;border-radius:4px;background:var(--gold);opacity:.6;margin:4px auto 10px}
.sheet{border-top:3px solid var(--gold)}
.shead{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.plate{background:var(--plate);color:var(--plate-ink);font:700 20px var(--display);letter-spacing:.06em;padding:6px 10px;border-radius:4px;min-width:64px;text-align:center;font-variant-numeric:tabular-nums;border:2px solid #9aa0a0}
.shead .t{flex:1;min-width:0}
.shead h2{font:700 17px var(--display);margin:0 0 4px;text-wrap:balance}
.tag{display:inline-block;font:700 11px var(--body);text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:999px;color:#fff}
.x{border:0;background:transparent;color:var(--muted);font-size:24px;line-height:1;cursor:pointer;padding:4px}
form{display:grid;gap:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:grid;gap:5px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
input,select,textarea{font:500 16px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 11px;width:100%;box-sizing:border-box;min-width:0}
textarea{min-height:58px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.btn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:11px 14px;font:600 14.5px var(--body);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex:1;justify-content:center}
.btn.danger{color:var(--rep);border-color:color-mix(in srgb,var(--rep) 40%,transparent)}
.meta{font-size:12.5px;color:var(--muted);margin-top:10px;font-variant-numeric:tabular-nums}
.coords{font:500 12.5px ui-monospace,Menlo,Consolas,monospace;color:var(--muted)}
.list{display:grid;gap:2px}
.li{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;color:inherit;text-align:left;font:inherit;width:100%}
.li .n{width:28px;height:28px;border-radius:50%;color:#fff;font:700 13px var(--display);display:grid;place-items:center;flex:none}
.li .b{flex:1;min-width:0}
.li .p{font:700 14.5px var(--display)}
.li .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .st{font-size:11.5px;font-weight:700;color:var(--done);text-transform:uppercase}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.filters .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.empty{padding:14px;color:var(--muted);font-size:14px}
.hist{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.hist summary{font:700 13px var(--display);color:var(--accent);cursor:pointer;list-style:none}
.hist summary::-webkit-details-marker{display:none}
.hist summary::before{content:"▸ ";}
.hist[open] summary::before{content:"▾ ";}
.hist ol{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.hist li{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:13.5px;align-items:baseline}
.hist time{font:600 12px var(--body);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.repdate{font:600 12.5px var(--body);color:var(--done);margin-top:3px}
.dl{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.dl .btn{padding:9px 12px;font-size:13.5px}
label.check{display:flex;align-items:center;gap:10px;text-transform:none;letter-spacing:0;font:600 15px var(--body);color:var(--ink);cursor:pointer;padding:2px 0}
label.check input{width:22px;height:22px;margin:0;accent-color:var(--accent);flex:none}
.pin .rep{fill:var(--gold);stroke:var(--panel);stroke-width:2}
.stat.alert{background:var(--gold);border-color:var(--gold);color:#2a1d1f;cursor:pointer}
.reportbtn{width:100%;justify-content:center;margin:-4px 0 14px;border-color:var(--gold);color:var(--ink);background:color-mix(in srgb,var(--gold) 14%,var(--panel))}
.repitem{border-top:1px solid var(--line);padding:10px 0;display:grid;gap:4px}
.repitem .t{font:700 14.5px var(--display)}
.repitem .m{font-size:13px;color:var(--muted)}
.repitem .a{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.repitem .a .btn{padding:8px 12px;font-size:13.5px}
.modal select,.modal textarea,.modal input{font:500 16px var(--body)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:4px 0 14px}
.facts div{min-width:0}
.facts dt{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.facts dd{margin:2px 0 0;font:600 15px var(--body);color:var(--ink)}
.facts .wide{grid-column:1/-1}
.foto{display:grid;gap:8px;margin:0 0 14px}
.foto img{width:100%;max-height:340px;object-fit:cover;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.foto img{max-height:260px}
label.fotobtn{display:inline-flex;justify-content:center;cursor:pointer;text-transform:none;letter-spacing:0;font:600 14.5px var(--body);color:var(--ink)}
.reportbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.modebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-4px 0 12px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--gold) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);font-size:13.5px}
.modebar .linkbtn{font-size:13.5px}
.meter{display:grid;gap:6px;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:12px 14px;margin:0 0 12px;cursor:pointer;color:var(--ink);font:inherit}
.meter .mt{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font:700 13px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.meter .mt b{font:800 22px var(--display);letter-spacing:0;color:var(--mcol,var(--done))}
.bar{height:12px;border-radius:999px;background:color-mix(in srgb,var(--muted) 18%,transparent);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--mcol,var(--done));transition:width .6s ease}
.meter .ms{font-size:13px;color:var(--muted)}
.gauge{display:grid;justify-items:center;gap:2px;margin:4px 0 10px}
.gauge svg{width:min(100%,300px);height:auto}
.gauge .pct{font:800 44px var(--display);color:var(--mcol);line-height:1;margin-top:-74px}
.gauge .lbl{font-size:13.5px;color:var(--muted);margin-top:6px;text-align:center}
.brk{display:grid;gap:9px;margin:6px 0 12px}
.brk .r{display:grid;grid-template-columns:118px 1fr 34px;gap:10px;align-items:center;font-size:13.5px}
.brk .r b{text-align:right;font:800 14px var(--display);font-variant-numeric:tabular-nums}
.brk .bar{height:9px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(20,10,12,.55);display:grid;place-items:center;padding:20px}
.modal .box{background:var(--panel);color:var(--ink);border-radius:16px;border-top:4px solid var(--gold);box-shadow:var(--shadow);width:min(100%,360px);padding:18px;display:grid;gap:12px}
.modal h3{margin:0;font:800 17px var(--display);color:var(--accent)}
.modal p{margin:0;font-size:14px;color:var(--muted);line-height:1.4}
.modal .row{display:flex;gap:8px;justify-content:flex-end}
.locate{position:absolute;top:80px;right:max(12px,env(safe-area-inset-right,0px));z-index:4;width:46px;height:46px;border-radius:12px;border:0;background:var(--panel);color:var(--accent);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer}
.locate svg{width:22px;height:22px}
.locate[aria-pressed="true"]{background:#2f6fd6;color:#fff}
.me .acc{fill:rgba(47,111,214,.15);stroke:rgba(47,111,214,.45);stroke-width:1}
.me .dot{fill:#2f6fd6;stroke:#fff;stroke-width:3}
.editor{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted)}

const wToLL = (x,y)=>[17.05 + (-y/1.1057)*1e-5, -96.71 + (x/(K*1.1132))*1e-5];
const WAYS = RAW.split("\n").map(l=>{const [n,p]=l.split("|");return {n,pts:p.split(";").map(q=>{const [a,b]=q.split(",").map(Number);return toW(a,b);})};});
const LABELS = [
 ["Av. Trinidad de las Huertas",[-47,-552],[131,-530],.5,true],
 ["Av. Universidad",[7,-356],[139,-339],.5,true],
 ["Huerto Los Laureles",[31,-486],[20,-422],.5],["Huerto Limonares",[161,-468],[150,-403],.55],
 ["Huerto Naranjos",[207,-464],[197,-396],.6],["Huerto Los Olivos",[253,-460],[241,-389],.5],
 ["Huerto Los Sabinos",[110,-652],[85,-534],.3],["Huerto Los Framboyanes",[-47,-552],[-59,-481],.5],
 ["Huerto Los Olmos",[-2,-544],[-23,-429],.45],["Huerto Los Manzanos",[-59,-481],[-151,-494],.5],
 ["Huerto Los Mangos",[-71,-675],[-93,-560],.5],["Huerto Las Flores",[-151,-494],[-158,-450],.5],
 ["Huerto Los Platanares",[109,-409],[64,-416],.5],["Huerto Los Ciruelos",[-24,-670],[65,-658],.5],
 ["Priv. de Limonares",[161,-468],[31,-486],.4]
].map(([t,a,b,f,main])=>{const A=toW(...a),B=toW(...b);return {t,main:!!main,x:A[0]+(B[0]-A[0])*f,y:A[1]+(B[1]-A[1])*f,ang:Math.atan2(B[1]-A[1],B[0]-A[0])};});

const TIPOS = {reparacion:{txt:"Por reparar",c:"var(--rep)"}, falta:{txt:"Falta luminaria",c:"var(--falta)"}, revisar:{txt:"Revisar poste",c:"var(--rev)"}, poda:{txt:"Requiere poda",c:"var(--poda)"}, ok:{txt:"Funciona bien",c:"var(--done)"}};

const tipoDe = f => ({"Funciona bien":"ok","Falta luminaria":"falta","Revisar poste":"revisar","Requiere poda":"poda","Apagada":"reparacion","Fundida":"reparacion","Parpadea":"reparacion","Se queda prendida de día":"reparacion","Requiere reparación":"reparacion","Otra":"reparacion"})[f] || null;
const ESTADOS = {pendiente:"Pendiente", atendido:"Reparado"};
const estTxt = (p,k)=> k==="atendido"&&p.tipo==="poda" ? "Podado" : ESTADOS[k];
const fecha = iso=>{ try{ return new Date(iso).toLocaleDateString("es-MX",{day:"2-digit",month:"2-digit",year:"numeric"}); }catch(e){ return ""; } };
const fechaHora = iso=>{ try{ return new Date(iso).toLocaleString("es-MX",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; } };
const legibleOf = p => p.numLegible!==undefined ? !!p.numLegible : (/\d/.test(p.poste||"") && !/s\/n/i.test(p.poste||""));
const histPush = (p,t)=>[...(Array.isArray(p.historial)?p.historial:[]),{f:new Date().toISOString(),t}].slice(-60);
const isGreen = p => p.tipo==="ok" || p.estado==="atendido";
const colorOf = p => isGreen(p) ? "var(--done)" : (TIPOS[p.tipo]||TIPOS.reparacion).c;
const labelOf = p => p.tipo==="ok" ? "Funciona bien" : p.estado==="atendido" ? (p.tipo==="poda"?"Podado":"Reparado") : (TIPOS[p.tipo]||TIPOS.reparacion).txt;
function parseLL(str){
  const t=String(str||"").replace(/%2C/gi,",");
  const m = t.match(/@(-?\d+\.\d+),\s*(-?\d+\.\d+)/) || t.match(/[?&](?:q|query|ll|destination)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/i) || t.match(/(-?\d{1,2}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})/);
  if(!m) return null; const lat=+m[1], lon=+m[2];
  if(!(lat>16.9&&lat<17.2&&lon>-96.9&&lon<-96.5)) return {far:true};
  const [x,y]=llToW(lat,lon); if(x<B[0]-400||x>B[2]+400||y<B[1]-400||y>B[3]+400) return {far:true};
  return {lat,lon};
}

let query = "", crew = "", searchOpen = false;
const norm = t=>String(t??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
const searching = ()=> searchOpen && (query!=="" || crew!=="");
function matches(p){
  if(crew){ const c=p.cuadrilla||""; if(crew==="-"? c!=="" : c!==crew) return false; }
  if(!query) return true; const q=norm(query);
  if(/^\d+$/.test(q)){ if(String(p.num)===q) return true; return norm(p.poste).replace(/\s/g,"").split(/[^0-9]+/).some(n=>n.startsWith(q)); }
  return norm(p.poste).includes(q)||norm(p.ubicacion).includes(q);
}
let onlyFaults = false; try{ onlyFaults = localStorage.getItem("soloFallas")==="1"; }catch(e){}

const $ = id=>document.getElementById(id);
const svg = $("svg"), gWorld = $("world"), gLabels = $("labels"), gPins = $("pins");
const NS = "http://www.w3.org/2000/svg";
const el = (t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};

// ---------- Build streets once ----------
const wpath = pts=>"M"+pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join("L");
for (const w of WAYS){ const main=w.n.startsWith("Av."), pr=w.n.startsWith("Priv");
  el("path",{d:wpath(w.pts),class:"street-c","stroke-width":main?17:pr?8:12},gWorld); }
for (const w of WAYS){ const main=w.n.startsWith("Av."), pr=w.n.startsWith("Priv");
  el("path",{d:wpath(w.pts),class:"street","stroke-width":main?14:pr?5.5:9},gWorld); }

const B = (()=>{let a=[1e9,1e9,-1e9,-1e9];WAYS.forEach(w=>w.pts.forEach(([x,y])=>{a=[Math.min(a[0],x),Math.min(a[1],y),Math.max(a[2],x),Math.max(a[3],y)]}));return a;})();
function fit(){ const r=svg.getBoundingClientRect(); const pad=28;
  const s=Math.min((r.width-pad*2)/(B[2]-B[0]),(r.height-pad*2-60)/(B[3]-B[1]));
  view={s,tx:r.width/2-(B[0]+B[2])/2*s,ty:(r.height-50)/2-(B[1]+B[3])/2*s}; draw(); }
const toS = (x,y)=>[x*view.s+view.tx, y*view.s+view.ty];
const fromS = (sx,sy)=>[(sx-view.tx)/view.s,(sy-view.ty)/view.s];

function draw(){
  gWorld.setAttribute("transform",`translate(${view.tx},${view.ty}) scale(${view.s})`);
  gLabels.textContent="";
  if (view.s>0.55) for (const L of LABELS){ const [x,y]=toS(L.x,L.y); let d=L.ang*180/Math.PI; if(d>90)d-=180; if(d<-90)d+=180;
    const t=el("text",{x,y,class:"slabel"+(L.main?" main":""),"text-anchor":"middle","dominant-baseline":"central",transform:`rotate(${d} ${x} ${y}) translate(0 ${L.main?0:-13})`},gLabels); t.textContent=L.t; }
  drawPins();
}
function drawPins(){
  gPins.textContent="";
  if (myPos){ const [wx,wy]=llToW(myPos.lat,myPos.lon); const [x,y]=toS(wx,wy); const g=el("g",{class:"me",transform:`translate(${x},${y})`},gPins);
    el("circle",{r:Math.max(10,Math.min(120,myPos.acc*view.s)),class:"acc"},g); el("circle",{r:8,class:"dot"},g); }
  const list=[...poles].sort((a,b)=>(a.id===selected)-(b.id===selected));
  for (const p of list){ if(p.id!==selected){ if(searching()){ if(!matches(p)) continue; } else if(onlyFaults && isGreen(p)) continue; }
    const [wx,wy]=p._drag||llToW(p.lat,p.lon); const [x,y]=toS(wx,wy); const ok=p.tipo==="ok";
    const g=el("g",{class:"pin"+(p.id===selected?" sel":"")+(ok?" ok":""),transform:`translate(${x},${y})`,"data-id":p.id,tabindex:"0",role:"button","aria-label":`Poste ${p.poste||"sin número"}, ${labelOf(p)}`},gPins);
    if (p.id===selected) el("circle",{r:ok?14:17,class:"ring"},g);
    el("circle",{r:ok?10:13,class:"dot",fill:colorOf(p)},g);
    if(repCounts[p.id]) el("circle",{cx:ok?8:10,cy:ok?-8:-10,r:5.5,class:"rep"},g);
    const t=el("text",{},g); t.textContent=p.num??"•"; }
  if (pendingNew){ const [x,y]=toS(pendingNew.x,pendingNew.y); const g=el("g",{class:"newpin",transform:`translate(${x},${y})`},gPins);
    el("circle",{r:14,class:"halo"},g); el("circle",{r:15},g); const t=el("text",{},g); t.textContent="#"+nextNum(); }
}

// ---------- Gestures: pan, pinch, drag pins ----------
const ptrs=new Map(); let gest=null;
svg.addEventListener("pointerdown",e=>{
  svg.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const pin=e.target.closest&&e.target.closest(".pin");
  if (ptrs.size===1){
    if (pin && (!placing || rol!=="admin")){ const p=poles.find(q=>q.id===pin.dataset.id); gest={type:"pin",p,sx:e.clientX,sy:e.clientY,moved:false,orig:[p.lat,p.lon]}; }
    else gest={type:"pan",sx:e.clientX,sy:e.clientY,tx:view.tx,ty:view.ty,moved:false};
  } else if (ptrs.size===2){
    if (gest&&gest.type==="pin"&&gest.p) delete gest.p._drag;
    const [a,b]=[...ptrs.values()]; gest={type:"pinch",d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2,s:view.s,tx:view.tx,ty:view.ty,moved:true};
  }
});
svg.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId)||!gest)return; ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const r=svg.getBoundingClientRect();
  if (gest.type==="pan"){ const dx=e.clientX-gest.sx, dy=e.clientY-gest.sy; if(Math.hypot(dx,dy)>5)gest.moved=true; view.tx=gest.tx+dx; view.ty=gest.ty+dy; draw(); }
  else if (gest.type==="pin"){ const dx=e.clientX-gest.sx, dy=e.clientY-gest.sy;
    if(!gest.moved&&Math.hypot(dx,dy)>7){ if(rol!=="admin"){gest={type:"pan",sx:e.clientX,sy:e.clientY,tx:view.tx,ty:view.ty,moved:true};return;} gest.moved=true; selected=gest.p.id; }
    if(gest.moved){ gest.p._drag=fromS(e.clientX-r.left,e.clientY-r.top); drawPins(); } }
  else if (gest.type==="pinch"&&ptrs.size>=2){ const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y);
    const s=Math.max(.4,Math.min(12,gest.s*d/gest.d)); const mx=(a.x+b.x)/2-r.left, my=(a.y+b.y)/2-r.top, m0x=gest.mx-r.left, m0y=gest.my-r.top;
    const wx=(m0x-gest.tx)/gest.s, wy=(m0y-gest.ty)/gest.s; view={s,tx:mx-wx*s,ty:my-wy*s}; draw(); }
});
function endPtr(e){
  if(!ptrs.has(e.pointerId))return; ptrs.delete(e.pointerId);
  const r=svg.getBoundingClientRect();
  if (gest&&ptrs.size===0){
    if (gest.type==="pin"){
      if (gest.moved){ const [x,y]=gest.p._drag; delete gest.p._drag; const [lat,lon]=wToLL(x,y); movePole(gest.p,lat,lon,gest.orig); }
      else if (placing && rol!=="admin"){ const q=gest.p; setPlacing(false); reportModal({posteId:q.id,posteNum:q.poste||"S/N",lat:q.lat,lon:q.lon,titulo:`Poste ${q.poste||"S/N"} · ${q.ubicacion||""}`}); }
      else { selected=gest.p.id; pendingNew=null; openDetail(gest.p); }
    } else if (gest.type==="pan" && !gest.moved){
      if (placing){ const [x,y]=fromS(e.clientX-r.left,e.clientY-r.top); pendingNew={x,y}; setPlacing(false); openNew(); }
      else if (creating && pendingNew){ const [x,y]=fromS(e.clientX-r.left,e.clientY-r.top); pendingNew={x,y}; const [la,lo]=wToLL(x,y); creating.lat=la; creating.lon=lo; delete creating._loc; const c=$("sheetCoords"); if(c) c.textContent=la.toFixed(6)+", "+lo.toFixed(6); }
      else if (selected||!$("sheet").hidden){ closeSheet(); }
    }
    gest=null; drawPins();
  } else if (ptrs.size===1 && gest && gest.type==="pinch"){ const [p]=[...ptrs.values()]; gest={type:"pan",sx:p.x,sy:p.y,tx:view.tx,ty:view.ty,moved:true}; }
}
svg.addEventListener("pointerup",endPtr); svg.addEventListener("pointercancel",endPtr);
svg.addEventListener("wheel",e=>{e.preventDefault(); const r=svg.getBoundingClientRect(); const mx=e.clientX-r.left,my=e.clientY-r.top;
  const s=Math.max(.4,Math.min(12,view.s*Math.exp(-e.deltaY*0.0015))); const wx=(mx-view.tx)/view.s, wy=(my-view.ty)/view.s; view={s,tx:mx-wx*s,ty:my-wy*s}; draw();},{passive:false});
svg.addEventListener("keydown",e=>{const pin=e.target.closest&&e.target.closest(".pin"); if(pin&&(e.key==="Enter"||e.key===" ")){e.preventDefault(); const p=poles.find(q=>q.id===pin.dataset.id); selected=p.id; openDetail(p); drawPins();}});

function summary(){
  const bad=poles.filter(p=>!isGreen(p));
  const c=t=>bad.filter(p=>p.tipo===t).length;
  const st=(n,t,col)=>`<span class="stat"><i style="background:${col}"></i><b>${n}</b>${t}</span>`;
  const nRep=Object.values(repCounts).reduce((a,b)=>a+b,0);
  const alertH = (rol==="admin"&&nRep) ? `<button type="button" class="stat alert" id="openRep"><b>${nRep}</b>${nRep===1?"reporte nuevo":"reportes nuevos"}</button>` : "";
  $("summary").innerHTML = poles.length
    ? alertH+`<span class="stat"><b>${poles.length}</b>registrados</span>`+st(c("reparacion"),"por reparar","var(--rep)")+st(c("falta"),"sin luz","var(--falta)")+st(c("revisar"),"revisar","var(--rev)")+st(c("poda"),"poda","var(--poda)")+st(poles.length-bad.length,"funcionan","var(--done)")

function formHTML(p, isNew, showLoc){

    ${canWrite?`<button type="button" class="linkbtn" id="showLoc"${showLoc?" hidden":""}>${isNew?"Ubicar con GPS o coordenadas":"Cambiar ubicación (GPS o coordenadas)"}</button>
    <div class="locbox" id="locBox"${showLoc?"":" hidden"}>
      <button type="button" class="btn gpsbtn" id="gpsHere"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 21s-7-6.3-7-12a7 7 0 0 1 14 0c0 5.7-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>Usar mi ubicación actual</button>
      <label for="f-loc">Ubicación desde Google Maps<input id="f-loc" placeholder="Pega aquí las coordenadas o el enlace" autocomplete="off"></label>
      <div class="hint" id="locHint">En Google Maps mantén presionado tu punto azul (o el lugar del poste), copia las coordenadas que aparecen arriba y pégalas aquí.</div>
    </div>`:""}

      ${!isNew&&canWrite?`<button class="btn danger" type="button" id="btnDel">Eliminar</button>`:""}
    </div>
    <div id="delBox"></div>
  </form>`;
}
function head(p,isNew){
  return `<div class="grab"></div><div class="shead">
    <div class="plate" id="sheetPlate">${esc(p.poste||"S/N")}</div>
    <div class="t"><h2>${isNew?`Nuevo poste #${nextNum()}`:esc(p.ubicacion||"Sin calle")}</h2>
      ${isNew?`<span class="tag" id="sheetTag" style="background:var(--muted)">Elige cómo está</span>`:`<span class="tag" id="sheetTag" style="background:${colorOf(p)}">${labelOf(p)}</span>`}
      ${!isNew&&p.estado==="atendido"&&p.tipo!=="ok"&&p.fechaReparacion?`<div class="repdate">${p.tipo==="poda"?"Podado":"Reparado"} el ${esc(fecha(p.fechaReparacion))}</div>`:""}
      <div class="coords" id="sheetCoords">${p.lat.toFixed(6)}, ${p.lon.toFixed(6)}</div></div>
    <button class="x" type="button" id="btnClose" aria-label="Cerrar">×</button></div>`;
}
function readForm(p){ const f=new FormData($("pform")); const o={}; for(const [k,v] of f) o[k]=String(v).trim();
  const lg=$("f-leg"); if(lg) o.numLegible=!!lg.checked;
  o.tipo = tipoDe(o.falla) || p.tipo || "reparacion"; if(o.tipo==="ok") o.estado = o.estado || "pendiente";
  if(p._loc){ o.lat=+p._loc.lat.toFixed(7); o.lon=+p._loc.lon.toFixed(7); }
  return o; }
function wireLoc(p,isNew){
  const inp=$("f-loc"); if(!inp) return; const hint=$("locHint");
  const sb=$("showLoc"); if(sb) sb.onclick=()=>{ sb.hidden=true; $("locBox").hidden=false; };
  const gh=$("gpsHere"); if(gh) gh.onclick=async()=>{ hint.className="hint"; hint.textContent="Buscando tu ubicación…";
    const r=await locate(); if(!r.ok){ hint.className="hint err"; hint.textContent=r.msg; return; }
    inp.value=r.lat.toFixed(6)+", "+r.lon.toFixed(6); apply(); if(p._loc){ hint.textContent=`Ubicación del GPS (±${Math.round(r.acc)} m). Se guardará en este punto.`; } };

}

      } else { const num=nextNum(); ok=await guard(async()=>{ await coll.doc("n"+Date.now().toString(36)).set({num,poste:r.posteNum||"",falla:r.falla==="Poste dañado"?"Revisar poste":r.falla,tipo:t,estado:"pendiente",cuadrilla:"",numLegible:true,ubicacion:"",entre:"",notas:r.comentario||"",origen:"Reporte vecinal",lat:r.lat,lon:r.lon,actualizado:now,historial:[{f:now,t:`Registrado por reporte vecinal: ${r.falla}`}]}); await apiPost({action:"resolverReporte",rid:r.rid,aceptar:true}); },`Poste #${num} registrado`); }

function changeClave(){
  const m=document.createElement("div"); m.className="modal"; m.innerHTML=`<form class="box" autocomplete="off"><h3>Cambiar clave del comité</h3><p>La nueva clave se pedirá en todos los celulares que tengan la anterior. Usa al menos 6 caracteres.</p><input id="pw1" type="password" autocomplete="new-password" placeholder="Nueva clave" required minlength="6"><input id="pw2" type="password" autocomplete="new-password" placeholder="Repite la nueva clave" required minlength="6"><div class="hint err" id="pwErr" hidden></div><div class="row"><button type="button" class="btn" id="pwNo">Cancelar</button><button type="submit" class="btn primary" style="flex:0 0 auto">Cambiar</button></div></form>`;

function askClave(){ return new Promise(res=>{
  const m=document.createElement("div"); m.className="modal"; m.innerHTML=`<form class="box" autocomplete="off"><h3>Entrar</h3><p>Escribe la <b>clave del comité</b> o la <b>clave temporal</b> que te dieron para dar mantenimiento. Los vecinos pueden ver el mapa sin clave.</p><input id="claveIn" type="password" autocomplete="current-password" placeholder="Clave" required autocapitalize="off"><div class="hint err" id="claveErr" hidden></div><div class="row"><button type="button" class="btn" id="claveNo">Cancelar</button><button type="submit" class="btn primary" style="flex:0 0 auto">Entrar</button></div></form>`;

    catch(e){ err.hidden=false; err.textContent = e.code==="clave" ? "Clave incorrecta." : "No se pudo comprobar. Revisa tu internet."; } };
}); }
async function saveEdit(p,o){
  if(rol==="operador"){ o={notas:o.notas||""}; }
  let h=p; const ev=[];
  if(rol==="operador" && (o.notas||"")!==(p.notas||"")) ev.push("Nota del operador actualizada");
  if(o.falla && o.falla!==p.falla) ev.push(`Cómo está: ${o.falla}`);
  if((o.cuadrilla||"")!==(p.cuadrilla||"")) ev.push(o.cuadrilla?`Asignado a Cuadrilla ${o.cuadrilla}`:"Sin cuadrilla asignada");
  if((o.poste||"")!==(p.poste||"")) ev.push(`Número de poste: ${o.poste||"S/N"}`);
  if(o.numLegible!==undefined && o.numLegible!==legibleOf(p)) ev.push(o.numLegible?"Número legible: sí":"Número legible: no");
  if(o.lat!==undefined) ev.push("Se actualizó la ubicación");
  let hist=Array.isArray(p.historial)?p.historial:[]; for(const t of ev){ hist=histPush({historial:hist},t); }
  const upd={...o,actualizado:nowISO()}; if(ev.length) upd.historial=hist;
  const ok=await guard(()=>coll.doc(p.id).update(upd),"Cambios guardados"); if(ok) closeSheet(); }
async function createPole(p){
  const num=Math.max(0,...poles.map(q=>q.num||0))+1;
  const data={num,poste:p.poste,falla:p.falla,tipo:p.tipo,estado:p.estado,cuadrilla:p.tipo==="ok"?"":(p.cuadrilla||""),numLegible:p.numLegible!==undefined?p.numLegible:true,ubicacion:p.ubicacion,entre:p.entre,notas:p.notas,origen:"App (recorrido)",historial:[{f:new Date().toISOString(),t:`Registrado: ${p.falla}`}],lat:+p.lat.toFixed(7),lon:+p.lon.toFixed(7),actualizado:nowISO()};
  const hiddenNow = onlyFaults && data.tipo==="ok";
  const ok=await guard(()=>coll.doc("n"+Date.now().toString(36)).set(data), hiddenNow?`Poste #${num} guardado (en verde; toca «Mostrar todos» para verlo)`:`Poste #${num} guardado`); if(ok) closeSheet();
}
async function movePole(p,lat,lon,orig){
  const prev={lat:p.lat,lon:p.lon}; p.lat=lat; p.lon=lon; drawPins();
  const ok=await guard(()=>coll.doc(p.id).update({lat:+lat.toFixed(7),lon:+lon.toFixed(7),actualizado:nowISO()}));
  if(!ok){p.lat=prev.lat;p.lon=prev.lon;drawPins();return;}
  toast(`Poste ${p.poste||"S/N"} movido`,async()=>{ await guard(()=>coll.doc(p.id).update({lat:orig[0],lon:orig[1],actualizado:nowISO()}),"Posición restaurada"); });
  if(!$("sheet").hidden && selected===p.id) openDetail(p);
}
async function removePole(p){ const ok=await guard(()=>coll.doc(p.id).delete(),`Poste ${p.poste||"S/N"} eliminado`); if(ok) closeSheet(); }

// ---------- Datos: hoja de Google (Apps Script) ----------
function locate(){ return new Promise(res=>{
  if(!navigator.geolocation) return res({ok:false,msg:"Este celular no permite usar la ubicación."});
  navigator.geolocation.getCurrentPosition(pos=>{ const lat=pos.coords.latitude, lon=pos.coords.longitude, acc=pos.coords.accuracy||0;
      const [x,y]=llToW(lat,lon); if(x<B[0]-400||x>B[2]+400||y<B[1]-400||y>B[3]+400) return res({ok:false,msg:"Tu ubicación queda fuera del fraccionamiento."});
      res({ok:true,lat,lon,acc}); },
    err=>res({ok:false,msg: err.code===1?"Permite el acceso a tu ubicación en el navegador para usar el GPS.":"No se pudo obtener tu ubicación. Intenta al aire libre."}),
    {enableHighAccuracy:true,timeout:15000,maximumAge:0}); }); }
function toggleMe(){
  const b=$("btnMe");
  if(watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId=null; myPos=null; b.setAttribute("aria-pressed","false"); drawPins(); return; }
  if(!navigator.geolocation){ toast("Este celular no permite usar la ubicación."); return; }
  b.setAttribute("aria-pressed","true"); let first=true; toast("Buscando tu ubicación…");
  watchId=navigator.geolocation.watchPosition(pos=>{ myPos={lat:pos.coords.latitude,lon:pos.coords.longitude,acc:pos.coords.accuracy||0};
      if(first){ first=false; const r=svg.getBoundingClientRect(); const [x,y]=llToW(myPos.lat,myPos.lon); const s=Math.max(view.s,2.5); view={s,tx:r.width/2-x*s,ty:r.height*0.45-y*s}; draw(); } else drawPins(); },
    err=>{ toast(err.code===1?"Permite el acceso a tu ubicación en el navegador.":"No se pudo obtener tu ubicación."); if(watchId!==null) navigator.geolocation.clearWatch(watchId); watchId=null; myPos=null; b.setAttribute("aria-pressed","false"); drawPins(); },
    {enableHighAccuracy:true,maximumAge:5000,timeout:20000});
}
let repCounts={};
async function apiGet(){ const r=await fetch(API_URL+"?t="+Date.now(),{cache:"no-store"}); const j=await r.json(); if(!j.ok) throw new Error("api"); repCounts=j.reportes||{}; return j.postes||[]; }
async function apiReport(body){ let j; try{ const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...body,action:"reportar"})}); j=await r.json(); }catch(e){ throw new Error("red"); } if(!j.ok) throw new Error(j.error||"error"); return j; }
async function apiPost(body,c){ let j;
  try{ const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...body,clave:c!==undefined?c:clave})}); j=await r.json(); }
  catch(e){ const er=new Error("red"); er.code="unavailable"; throw er; }
  if(!j.ok){ const er=new Error(j.error); er.code=j.error==="clave"?"clave":"unavailable"; throw er; } return j; }
let cache=[], listeners=[];
function emit(){ const docs=cache.map(p=>({id:p.id,data:()=>p})); listeners.forEach(f=>f({docs})); }
function setOnline(ok){ const b=$("dbBanner"); if(ok){ b.hidden=true; } else { b.innerHTML='<span class="msg">No se pudo conectar con la hoja de datos. Revisa tu internet.</span>'; b.hidden=false; } }
async function refresh(){ try{ cache=await apiGet(); setOnline(true); emit(); }catch(e){ setOnline(false); if(!poles.length) $("summary").innerHTML='<span class="stat muted">Sin conexión</span>'; } }
coll = {
  onSnapshot(cb){ listeners.push(cb); refresh(); setInterval(()=>{ if(!document.hidden && !(gest&&gest.type==="pin")) refresh(); },20000);
    document.addEventListener("visibilitychange",()=>{ if(!document.hidden) refresh(); }); return ()=>{}; },
  doc(id){ return {
    update: async d=>{ await apiPost({action:"update",id,data:d}); cache=cache.map(p=>p.id===id?{...p,...d}:p); emit(); },
    set: async d=>{ await apiPost({action:"set",id,data:d}); cache=[...cache.filter(p=>p.id!==id),{...d,id}]; emit(); },
    delete: async()=>{ await apiPost({action:"delete",id}); cache=cache.filter(p=>p.id!==id); emit(); } }; }
};
db = coll;
canWrite = (rol==="admin");
if(clave && API_URL && !API_URL.startsWith("PEGA")) apiPost({action:"login"}).then(r=>{ if(r.rol!==rol||r.exp!==rolExp) setClave(clave,r.rol,r.exp); }).catch(e=>{ if(e.code==="clave"){ setClave(""); toast("Tu clave venció. Ahora estás como vecino."); } });
if(!API_URL || API_URL.startsWith("PEGA")){ const b=$("dbBanner"); b.innerHTML='<span class="msg">Falta conectar la hoja de Google (API_URL).</span>'; b.hidden=false; }
else coll.onSnapshot(snap=>{
  poles=snap.docs.map(d=>({id:d.id,...d.data()})).filter(p=>typeof p.lat==="number"&&typeof p.lon==="number"&&!isNaN(p.lat));
  summary(); if(searchOpen) $("scount").textContent=(query||crew)?(()=>{const n=poles.filter(matches).length;return n===0?"Sin resultados":n===1?"1 poste":n+" postes";})():"";
  if(!(gest&&gest.type==="pin"&&gest.moved)) drawPins();
});
})();
